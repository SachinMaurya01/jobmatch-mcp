services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-server:
    profiles: ["app"]
    build: .
    stdin_open: true
    tty: true
    environment:
      JOBMATCH_DATABASE_URL: postgresql+psycopg://jobmatch:jobmatch@postgres:5432/jobmatch
      JOBMATCH_ADZUNA_APP_ID: ${JOBMATCH_ADZUNA_APP_ID:-}
      JOBMATCH_ADZUNA_APP_KEY: ${JOBMATCH_ADZUNA_APP_KEY:-}
      JOBMATCH_ADZUNA_COUNTRY: ${JOBMATCH_ADZUNA_COUNTRY:-in}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
