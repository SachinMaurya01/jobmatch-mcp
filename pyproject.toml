[project]
name = "jobmatch-mcp"
version = "0.1.0"
description = "MCP server that ranks job postings against a resume"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastmcp>=3.4,<4",
    "httpx>=0.28,<1",
    "pgvector>=0.3.6,<1",
    "psycopg[binary]>=3.2.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5.1,<7",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[project.scripts]
jobmatch-mcp = "jobmatch_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobmatch_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["jobmatch_mcp.db.*", "migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL with pgvector",
]
